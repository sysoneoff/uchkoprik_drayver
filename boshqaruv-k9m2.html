<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>SysOne — Admin | Uchko'prik tumani</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* CSS Reset va Asosiy o'zgaruvchilar (qisqartirildi) */
:root{ --bg-0:#0A0E1A; --bg-1:#0F1426; --text:#F1F3F9; --text-dim:#8B93AB; --accent-a:#6366F1; --danger:#F87171; --ok:#34D399; --glass:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.14); }
*{box-sizing:border-box;} body{margin:0;font-family:'Inter',sans-serif;color:var(--text);background:var(--bg-0);}
.glass-strong{background:rgba(255,255,255,.1);border:1px solid var(--glass-border);border-radius:16px;}
#dash{display:flex;flex-direction:column;height:100vh;}
#dash-header{display:flex;align-items:center;padding:16px 24px;border-bottom:1px solid var(--glass-border);}
.dash-tabs{display:flex;gap:12px;margin-left:auto;}
.tab-btn{padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--text-dim);border:1px solid transparent;transition:all 0.2s;}
.tab-btn.active{background:rgba(99,102,241,.15);color:var(--accent-a);border-color:rgba(99,102,241,.3);}
#dash-body{flex:1;display:flex;overflow:hidden;}
.tab-content{display:none;flex:1;overflow-y:auto;padding:24px;}
.tab-content.active{display:block;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--text);border-radius:8px;padding:12px;outline:none;}
.section-card{background:rgba(255,255,255,.02);border:1px solid var(--glass-border);border-radius:12px;padding:24px;margin-bottom:24px;}
.pbtn{padding:12px 24px;border-radius:8px;border:none;cursor:pointer;font-weight:700;background:linear-gradient(135deg,#6366F1,#06B6D4);color:#fff;}
</style>
</head>
<body>

<div id="dash">
  <div id="dash-header" class="glass-strong" style="border-radius:0;">
    <div><h1 style="margin:0;font-family:'Outfit';font-size:18px;">SysOne Admin</h1></div>
    <div class="dash-tabs">
      <div class="tab-btn active" data-tab="district">🏛 Tuman Pasporti</div>
    </div>
  </div>

  <div id="dash-body">
    <!-- TAB: Tuman Pasporti (Iqtisodiy va ijtimoiy ma'lumotlar) -->
    <div id="tab-district" class="tab-content active">
      <h2 style="margin-top:0;font-family:'Outfit'">Tuman umumiy ma'lumotlari va Pasporti</h2>
      
      <div class="section-card">
        <h3 style="margin-top:0;">1. Asosiy ko'rsatkichlar</h3>
        <div class="field-grid">
          <div class="field"><label>Tuman hokimi</label><input id="dist-head" placeholder="F.I.Sh"></div>
          <div class="field"><label>Tashkil topgan sana</label><input id="dist-founded" placeholder="Masalan: 1926 yil 29 sentyabr"></div>
          <div class="field"><label>Umumiy maydon</label><input id="dist-area" placeholder="Masalan: 271 kv.km"></div>
        </div>
      </div>

      <div class="section-card">
        <h3 style="margin-top:0;">2. Iqtisodiyot (2026-yil 1-yarim yillik)</h3>
        <div class="field-grid">
          <div class="field"><label>Sanoat hajmi (mlrd.so'm)</label><input id="dist-ind" placeholder="2 762,8"></div>
          <div class="field"><label>Qishloq xo'jaligi hajmi (mlrd.so'm)</label><input id="dist-agr" placeholder="1 654,0"></div>
          <div class="field"><label>Xizmatlar hajmi (mlrd.so'm)</label><input id="dist-srv" placeholder="1 264,9"></div>
        </div>
      </div>

      <div class="section-card">
        <h3 style="margin-top:0;">3. Bandlik va ijtimoiy himoya</h3>
        <div class="field-grid">
          <div class="field"><label>Ishsizlik darajasi (%)</label><input id="dist-unemp" placeholder="4,0"></div>
          <div class="field"><label>Kambag'allik darajasi (%)</label><input id="dist-pov" placeholder="4,4"></div>
        </div>
      </div>

      <button class="pbtn" id="dist-save-btn">Barcha ma'lumotlarni saqlash</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
// Firebase initsializatsiyasi
const FIREBASE_CONFIG = { apiKey: "AIzaSyArc-jvUip_jMSbl0uYNP0sO0Z6-qgpBic", authDomain: "uchkoprik-mfy.firebaseapp.com", projectId: "uchkoprik-mfy" };
firebase.initializeApp(FIREBASE_CONFIG); const db = firebase.firestore();

// DB dan o'qish
db.collection('settings').doc('district').onSnapshot(doc => {
  if(doc.exists) {
    const d = doc.data();
    document.getElementById('dist-head').value = d.head || '';
    document.getElementById('dist-founded').value = d.founded || '';
    document.getElementById('dist-area').value = d.area || '';
    document.getElementById('dist-ind').value = d.indVol || '';
    document.getElementById('dist-agr').value = d.agrVol || '';
    document.getElementById('dist-srv').value = d.srvVol || '';
    document.getElementById('dist-unemp').value = d.unempRate || '';
    document.getElementById('dist-pov').value = d.povRate || '';
  }
});

// DB ga saqlash
document.getElementById('dist-save-btn').addEventListener('click', async () => {
  const btn = document.getElementById('dist-save-btn'); btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
  const data = {
    head: document.getElementById('dist-head').value.trim(),
    founded: document.getElementById('dist-founded').value.trim(),
    area: document.getElementById('dist-area').value.trim(),
    indVol: document.getElementById('dist-ind').value.trim(),
    agrVol: document.getElementById('dist-agr').value.trim(),
    srvVol: document.getElementById('dist-srv').value.trim(),
    unempRate: document.getElementById('dist-unemp').value.trim(),
    povRate: document.getElementById('dist-pov').value.trim()
  };
  try {
    await db.collection('settings').doc('district').set(data, { merge: true });
    alert("Ma'lumotlar muvaffaqiyatli yangilandi!");
  } catch(e) { alert("Xatolik: " + e.message); }
  btn.disabled = false; btn.textContent = "Barcha ma'lumotlarni saqlash";
});
</script>
</body>
</html>
